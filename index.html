
<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Losvera Roleplay - Login</title>

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <!-- GTA Background Capture -->
    <canvas id="game-background"></canvas>

    <!-- Login UI -->
    <div class="login-container">

        <div class="login-panel">
            <img class="login-logo"
                src="assets/img/Orange%20Skyline%20RP%20Gaming%20Logo.png"
                width="101"
                height="89"
                alt="Losvera Roleplay Logo">

            <h1 class="login-title">
                Selamat datang,
                <span style="color: rgb(255, 138, 0);">username</span>
            </h1>

            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7ZM14 7C14 8.10457 13.1046 9 12 9C10.8954 9 10 8.10457 10 7C10 5.89543 10.8954 5 12 5C13.1046 5 14 5.89543 14 7Z" fill="currentColor"></path>
                    <path d="M16 15C16 14.4477 15.5523 14 15 14H9C8.44772 14 8 14.4477 8 15V21H6V15C6 13.3431 7.34315 12 9 12H15C16.6569 12 18 13.3431 18 15V21H16V15Z" fill="currentColor"></path>
                </svg>

                <input type="text" class="login-input" placeholder="Username">
            </div>

            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M6 8C4.34315 8 3 9.34315 3 11V13C3 14.6569 4.34315 16 6 16C7.65685 16 9 14.6569 9 13H15V15H17V13H18V15H20V11H9C9 9.34315 7.65685 8 6 8ZM7 13V11C7 10.4477 6.55228 10 6 10C5.44772 10 5 10.4477 5 11V13C5 13.5523 5.44772 14 6 14C6.55228 14 7 13.5523 7 13Z" fill="currentColor"></path>
                </svg>

                <input type="password" class="login-input" placeholder="Password">
            </div>

            <button class="btn btn-primary login-button" type="button">
                Login
            </button>
        </div>

        <!-- Discord Section -->
        <div class="discord-section">
            <img class="img-fluid discord-logo"
                width="3971"
                height="2857"
                src="assets/img/pngaaa.com-2341881.png"
                alt="Discord">

            <p class="discord-heading">Join our discord!</p>

            <a class="discord-link"
                href="https://dsc.gg/losvera-roleplay">
                discord.gg/losvera-roleplay
            </a>
        </div>

    </div>

    <!-- Music Player -->
    <div class="music-player">

        <div class="music-header">
            <h1 class="music-title">Music Name</h1>
            <p class="music-artist">Artist Name</p>
        </div>

        <div class="music-controls">

            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" class="skip-back">
                <path d="M18 17L10 12L18 7V17Z" fill="currentColor"></path>
                <path d="M6 7H9V17H6V7Z" fill="currentColor"></path>
            </svg>

            <svg id="music-play" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" class="play">
                <path d="M11 7H8V17H11V7Z" fill="currentColor"></path>
                <path d="M13 17H16V7H13V17Z" fill="currentColor"></path>
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" class="skip-forward">
                <path d="M6 17L14 12L6 7V17Z" fill="currentColor"></path>
                <path d="M18 7H15V12V17H18V7Z" fill="currentColor"></path>
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none">
                <path d="M24 12C24 16.4183 20.4183 20 16 20V18C19.3137 18 22 15.3137 22 12C22 8.68629 19.3137 6 16 6V4C20.4183 4 24 7.58172 24 12Z" fill="currentColor"></path>
                <path d="M20 12C20 14.2091 18.2091 16 16 16V14C17.1046 14 18 13.1046 18 12C18 10.8954 17.1046 10 16 10V8C18.2091 8 20 9.79086 20 12Z" fill="currentColor"></path>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M9 16L15 20V4L9 8H5C2.79086 8 1 9.79086 1 12C1 14.2091 2.79086 16 5 16H9ZM5 10H9L13 7.5V16.5L9 14H5C3.89543 14 3 13.1046 3 12C3 10.8954 3.89543 10 5 10Z" fill="currentColor"></path>
            </svg>

            <input class="form-range volume-slider"
                type="range"
                min="0"
                max="100"
                value="70">
        </div>

        <div class="music-progress">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p>00:00</p>
            <p>00:45</p>
        </div>

        <audio id="music-audio" preload="auto"></audio>

    </div>

    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/music-player.js"></script>
    <script src="assets/js/game-background.js"></script>

</body>
</html>
